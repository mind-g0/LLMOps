apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never take a ready pod away before its replacement is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          # EDIT: your own wk2 image
          image: 3wa0/aidc-serving:cpu-v1
          ports:
            - containerPort: 8000
          lifecycle:
            preStop:            # keep serving while endpoint removal propagates;
              exec:
                command: ["sleep", "5"]   # fixed preStop sleep syntax
          env:
            - name: MODEL_BACKEND
              value: "echo"
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-0.5B-Instruct"
            - name: APP_VERSION       # an env var; changing it is one way to trigger a roll (the verifier flips VERIFY_STAMP)
              value: "v1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10