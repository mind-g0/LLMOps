apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-config
  namespace: llmops
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: llmops-llm-serving
        metrics_path: /metrics
        static_configs:
          - targets:
              - "llmops-llm-serving:8000"

      - job_name: llmops-ocr-serving
        metrics_path: /metrics
        static_configs:
          - targets:
              - "llmops-ocr-serving:8001"

      - job_name: llmops-server
        metrics_path: /metrics
        static_configs:
          - targets:
              - "10.0.0.50:9100"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prom-data
  namespace: llmops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: llmops
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=30d"

          ports:
            - containerPort: 9090

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: data
              mountPath: /prometheus

      volumes:
        - name: config
          configMap:
            name: prom-config

        - name: data
          persistentVolumeClaim:
            claimName: prom-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: llmops
spec:
  selector:
    app: prometheus

  ports:
    - port: 9090
      targetPort: 9090