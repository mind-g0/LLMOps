replicas: 1

image: vllm/vllm-openai:v0.27.1
# Qwen3.5-9B - FP8 (compressed-tensors)
model:
  id: /models/Qwen3.5-9B-FP8
  # quantization auto-detected from config.json (compressed-tensors fp8)
  dtype: auto
  maxModelLen: 8192
  # FP8 drops weights to ~14GB on disk, ~5GB less VRAM than BF16
  gpuMemoryUtilization: 0.35
  maxNumSeqs: 32

  autoToolChoice: true
  toolCallParser: hermes

apiKeySecret:
  name: serving-keys
  key: api-key

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 6
    memory: 16Gi
    nvidia.com/gpu: 1
  limits:
    cpu: 6
    memory: 16Gi
    nvidia.com/gpu: 1

modelCache:
  hostPath: /var/lib/hf-cache
  mountPath: /root/.cache/huggingface

startupProbe:
  periodSeconds: 10
  failureThreshold: 120

readinessProbe:
  periodSeconds: 5
  failureThreshold: 3

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUPercent: 70
  scaleDownStabilizationSeconds: 300

modelVolume:
  hostPath: /home/nassir/models/Qwen3.5-9B-FP8
  mountPath: /models/Qwen3.5-9B-FP8
