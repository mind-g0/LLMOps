replicas: 1

image: vllm/vllm-openai:v0.27.1
# Qianfan-OCR
model:
  id: /models/Qianfan-OCR
  # quantization: awq
  dtype: auto
  maxModelLen: 32768
  gpuMemoryUtilization: "0.3"
  maxNumSeqs: 64

  autoToolChoice: true
  toolCallParser: hermes

# We are managing the secret for the API key from the terminal.
apiKeySecret: 
  name: serving-keys
  key: api-key

service:
  type: ClusterIP
  port: 8001
  targetPort: 8000
  #nodePort: 30800

resources:
  requests:
    cpu: "2"
    memory: 4Gi
    nvidia.com/gpu: 1
  limits:
    cpu: "2"
    memory: 4Gi
    nvidia.com/gpu: 1

modelCache:
  hostPath: /var/lib/hf-cache
  mountPath: /root/.cache/huggingface

startupProbe:
  periodSeconds: 10
  failureThreshold: 60

readinessProbe:
  periodSeconds: 5
  failureThreshold: 3

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUPercent: 70
  scaleDownStabilizationSeconds: 300

modelVolume:
  hostPath: /home/nassir/models/Qianfan-OCR
  mountPath: /models/Qianfan-OCR