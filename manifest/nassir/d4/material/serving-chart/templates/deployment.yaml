apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-serving
  labels:
    app.kubernetes.io/name: serving
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}

  selector:
    matchLabels:
      app.kubernetes.io/name: serving
      app.kubernetes.io/instance: {{ .Release.Name }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      containers:
        - name: serving

          image: {{ .Values.image }}

          ports:
            - containerPort: 8000

          env:
            - name: MODEL_BACKEND
              value: {{ .Values.backend | quote }}

            - name: MODEL_ID
              value: {{ .Values.modelId | quote }}

            - name: MODEL_PATH
              value: "/app/.cache/huggingface"

            - name: HOST_PORT
              value: "8000"

            - name: MAX_TOKENS
              value: "256"

            - name: BASE_URL
              value: "http://localhost:8000"

            {{- if .Values.apiKeySecret }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret }}
                  key: api-key
            - name: SERVING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret }}
                  key: serving-api-key
            {{- else if .Values.apiKey }}
            # Teaching-only path.
            # Go-live should use apiKeySecret instead.
            - name: API_KEY
              value: {{ .Values.apiKey | quote }}
            {{- end }}

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 2
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: model
              mountPath: /app/.cache/huggingface

      volumes:
        - name: model
          hostPath:
            path: /home/nassir/models/Qwen3.5-4B
            type: Directory
