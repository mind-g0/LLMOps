# The wk2 container, as a single pod. This file is given complete on day 1;
# from tomorrow you write the YAML yourself.
apiVersion: v1
kind: Pod
metadata:
  name: serving
  labels:
    app: serving
spec:
  containers:
    - name: serving
     
      image: yas1er/aidc-serving:cpuv2
      ports:
        - containerPort: 8000
      env:
        - name: MODEL_BACKEND
          value: "echo"          # orchestration week: the objective is the cluster, not the model
        - name: MODEL_ID
          value: "Qwen/Qwen2.5-1.5B-Instruct"

# we have tow ways one is mount from local host and mount to the container, the other is to use a volume and mount it to the container, we will use the second way it well reed only wich is best way to handle the hugingface mount is good but the problem is whin the server is down and repuled we will get to cashe again (download it again) and it will take time to download the model again, so we will use the volume way to handle this problem and we will mount the model to the container
          
