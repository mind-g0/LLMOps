image: yas1er/aidc-serving:cpuv1

backend: echo

env:
  MODEL_BACKEND: echo
  MODEL_ID: "Qwen/Qwen2.5-1.5B-Instruct"

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUPercent: 50
  scaleDownStabilizationSeconds: 60