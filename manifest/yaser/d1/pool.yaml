# The wk2 container, as a single pod. This file is given complete on day 1;
# from tomorrow you write the YAML yourself.
apiVersion: v1
kind: Pod
metadata:
  name: serving
  labels:
    app: serving
spec:
  containers:
    - name: serving
     
      image: yas1er/aidc-serving:cpuv2
      ports:
        - containerPort: 8000
      env:
        - name: MODEL_BACKEND
          value: "echo"          # orchestration week: the objective is the cluster, not the model
        - name: MODEL_ID
          value: "Qwen/Qwen2.5-1.5B-Instruct"
