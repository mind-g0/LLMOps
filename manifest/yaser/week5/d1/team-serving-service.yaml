apiVersion: v1
kind: Service
metadata:
  name: team-serving
  namespace: llmops
  labels:
    app: vllm   # <- required so the ServiceMonitor can find this Service
spec:
  type: NodePort
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 32187